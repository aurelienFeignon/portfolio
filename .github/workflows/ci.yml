name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push qui en remplace un autre annule l'exécution précédente : inutile de
# payer deux fois pour un état obsolète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Origine publique du site — **valeur unique de la CI** (P1-17).
#
# Elle est ici et non dans le code : `src/seo/site-url.ts` reste le seul point de
# lecture, et il la reçoit par l'environnement. Elle est ici et non dans un secret
# de dépôt parce qu'un domaine public n'est pas un secret, et qu'une valeur
# versionnée se relit dans une revue de code — un réglage d'interface GitHub, non.
#
# Elle est consommée à **deux moments** : au `docker build` (les `canonical`, les
# `hreflang` et le sitemap sont gravés dans le HTML statique) et par les E2E, qui
# vérifient que l'image sert bien cette origine-là.
env:
  SITE_URL: https://aurelienfeignon.com

jobs:
  # ---------------------------------------------------------------------------
  # Les versions ne sont recopiées NULLE PART dans ce fichier : elles sont lues
  # à leur source unique — l'`ARG` du Dockerfile pour Node, `packageManager`
  # pour pnpm (ADR-0007 §Règles 3 et 6). Une divergence dev/CI serait sinon
  # invisible jusqu'au jour où elle casse quelque chose.
  # ---------------------------------------------------------------------------
  versions:
    name: versions de référence
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.read.outputs.node }}
      pnpm: ${{ steps.read.outputs.pnpm }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          node_version="$(grep -oP '^ARG NODE_VERSION=\K.*' Dockerfile)"
          pnpm_version="$(grep -oP '"packageManager"\s*:\s*"pnpm@\K[^"]+' package.json)"
          test -n "$node_version" || { echo "NODE_VERSION introuvable dans le Dockerfile"; exit 1; }
          test -n "$pnpm_version" || { echo "packageManager introuvable dans package.json"; exit 1; }
          echo "node=$node_version" >> "$GITHUB_OUTPUT"
          echo "pnpm=$pnpm_version" >> "$GITHUB_OUTPUT"
          echo "Node $node_version · pnpm $pnpm_version"

  # ---------------------------------------------------------------------------
  # Gates rapides, exécutés nativement avec la version de Node du Dockerfile.
  # ---------------------------------------------------------------------------
  gates:
    name: lint · typecheck · tests · budget de bundle
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ needs.versions.outputs.pnpm }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.versions.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage

      - name: Budget de bundle
        run: pnpm build && pnpm bundle
        env:
          NODE_ENV: production

      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Construction de l'artefact de production et E2E **contre cette image**, et
  # non contre le serveur de développement (testing-strategy.md §8).
  # ---------------------------------------------------------------------------
  e2e:
    name: image de production · end-to-end
    runs-on: ubuntu-latest
    needs: [versions, gates]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'étage runner
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: portfolio:ci
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrer l'image et attendre le healthcheck
        run: |
          docker run -d --name portfolio-ci -p 3000:3000 portfolio:ci
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' portfolio-ci)"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then docker logs portfolio-ci; exit 1; fi
            sleep 2
          done
          docker logs portfolio-ci
          echo "Le conteneur n'est jamais devenu sain."
          exit 1

      # Le seuil de `performance-budget.md` §7 était **documenté et appliqué nulle
      # part** : cette étape se contentait d'écrire la taille dans le résumé.
      # Un seuil que rien ne fait respecter n'est pas un seuil — et c'est la
      # tâche censée consommer la marge qui l'a découvert, en s'y référant.
      #
      # ⭐ Le gate est une **cible du Makefile**, comme les autres, et non une
      # comparaison écrite ici : sans cela `make ci` resterait vert là où la CI
      # est rouge, et le seuil existerait en deux exemplaires. Le tag est aligné
      # sur celui que la cible attend.
      # ⛔⛔ **`| tee` avalait le code de sortie, donc ce gate n'a JAMAIS pu faire
      # échouer la CI.** Le shell par défaut d'Actions est `bash -e {0}` — **sans
      # `pipefail`** —, si bien que l'étape sortait avec le statut de `tee`,
      # toujours 0. P4-05 avait rendu ce seuil bloquant après avoir découvert
      # qu'il n'était appliqué nulle part ; il ne l'était toujours pas *ici*.
      # `shell: bash` sélectionne `bash --noprofile --norc -eo pipefail {0}`, et
      # `2>&1` fait entrer le détail de l'échec dans le résumé plutôt que de le
      # laisser sur stderr. Relevé en revue de P4-13.
      - name: Budget de taille de l'image de production
        shell: bash
        run: |
          docker image tag portfolio:ci portfolio:local
          make check-image-size 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ needs.versions.outputs.pnpm }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.versions.outputs.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Version des navigateurs alignée sur `@playwright/test` du lockfile : les
      # navigateurs et le client doivent aller ensemble.
      - name: Installer les navigateurs Playwright
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: End-to-end contre l'image de production
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          # L'image est servie depuis `localhost`, mais elle a été construite avec
          # l'origine de production : c'est cette dernière que les `canonical` et
          # les `hreflang` doivent annoncer, et c'est ce que le test vérifie.
          SITE_URL: ${{ env.SITE_URL }}
          CI: 'true'

      # ⛔⛔ « Lighthouse mobile ≥ 85 / a11y 100 / SEO 100 » est un critère de
      # SORTIE de la Phase 4 depuis la Phase 0, et il n'était mesuré nulle part —
      # le mot n'apparaissait que dans quatre documents. C'est le défaut du seuil
      # de 400 Mo, à l'identique. Relevé pendant l'inventaire de P4-12.
      #
      # ⭐ Le script tourne ici avec le Chromium déjà installé pour Playwright, et
      # décide lui-même de ce qui bloque : accessibilité et SEO à 100 (structurel),
      # « bonnes pratiques » sur ses audits — son score est plafonné par le HTTP nu
      # du banc —, performance relevée sans être bloquante sur un runner partagé.
      #
      # ⚠️ `shell: bash` et `2>&1` pour la raison écrite au-dessus : sans eux,
      # l'audit serait un gate incapable d'échouer, et son détail n'arriverait
      # pas au résumé.
      - name: Audit Lighthouse de l'image de production
        shell: bash
        run: node scripts/check-lighthouse.mts 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publication de l'artefact sur GHCR, tagué par le SHA de commit (ADR-0008 §5).
  #
  # Sur `main` uniquement : une PR est vérifiée, jamais publiée. Le job dépend
  # des trois précédents — rien ne sort du dépôt sans être passé par les gates
  # ET par les E2E contre l'image elle-même.
  # ---------------------------------------------------------------------------
  publish:
    name: publier l'image sur GHCR
    runs-on: ubuntu-latest
    needs: [versions, gates, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR n'accepte que des minuscules, or le propriétaire du dépôt porte une
      # majuscule. Dérivé de `github.repository` plutôt qu'écrit en dur : le nom
      # du dépôt reste la source unique.
      - id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          # Le SHA est le tag qui compte : c'est lui que déploie et que restaure
          # `deploy.sh`. `latest` n'est qu'une commodité de lecture, jamais
          # déployé — il change sous les pieds de celui qui le lit.
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.sha }}
            ${{ steps.ref.outputs.image }}:latest
          # La même origine qu'au job `e2e` : l'image publiée doit être celle qui
          # a été testée, jusqu'aux URL gravées dans son HTML.
          build-args: |
            SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Déploiement. Le VPS ne construit rien : il tire une image déjà publiée.
  #
  # La clé utilisée ici est enregistrée sur le serveur avec
  # `command="/srv/portfolio/deploy.sh"` : elle ne peut rien faire d'autre que
  # demander un déploiement ou un retour arrière. La chaîne envoyée arrive dans
  # `SSH_ORIGINAL_COMMAND`, où le script la valide avant de s'en servir.
  # ---------------------------------------------------------------------------
  deploy:
    name: déployer sur le VPS
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Clé de déploiement et hôte épinglé
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Hôte épinglé : `StrictHostKeyChecking=no` accepterait n'importe quel
          # serveur répondant à cette adresse.
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Déployer ce commit
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" "deploy ${GITHUB_SHA}"

      - name: Trace
        if: always()
        run: |
          echo "Déployé sur le VPS — \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
