# Ce fichier n'est PAS ici pour déclarer un monorepo — il n'y en a pas.
#
# Depuis pnpm 10, c'est le seul emplacement où les réglages propres à pnpm sont
# lus (`.npmrc` ne couvre plus que les réglages compatibles npm, et la variable
# `npm_config_store_dir` est ignorée : les deux ont été essayés et vérifiés
# inopérants en P1-03).

# --- Emplacement du store ---------------------------------------------------
#
# `storeDir` place le store à l'intérieur du volume nommé `node_modules`. Deux
# raisons, toutes deux vérifiées par l'échec inverse :
#
#   1. Par défaut, pnpm constate que son store et `node_modules` ne sont pas sur
#      le même système de fichiers et relocalise le store en `/app/.pnpm-store`,
#      c'est-à-dire dans le bind mount : 355 Mo déversés sur l'hôte, en violation
#      de CT-13 (« aucun binaire natif ne fuit du conteneur vers l'hôte »).
#   2. Sur le même système de fichiers, pnpm installe par **liens durs** au lieu
#      de copier — ce qui est la raison même de l'avoir choisi.
#
# Le chemin est **relatif**, et ce n'est pas un détail. Il a d'abord été écrit en
# absolu (`/app/…`), au motif qu'aucune commande de ce projet ne s'exécute hors
# du conteneur. C'était faux : l'ADR-0007 §Règles 6 fait tourner les gates de la
# CI nativement, où `/app` n'existe pas et n'est pas créable — `EACCES` au
# premier `pnpm install`. Trouvé par la CI, invisible en local (P1-14).
#
# En relatif, la résolution est correcte partout : `/app/node_modules/.pnpm-store`
# dans le conteneur, `<workspace>/node_modules/.pnpm-store` sur un runner. Dans
# les deux cas sur le même système de fichiers que `node_modules`, donc liens durs.
storeDir: node_modules/.pnpm-store

# --- Scripts d'installation -------------------------------------------------
#
# pnpm 11 n'exécute aucun script `postinstall` sans autorisation explicite : une
# dépendance compromise ne peut pas exécuter de code pendant l'installation.
# Cette protection est conservée, et chaque exception doit être justifiée ici.
#
# `unrs-resolver` (résolveur natif de `eslint-import-resolver-typescript`) livre
# ses binaires par dépendances optionnelles ; son `postinstall` n'est qu'un
# rattrapage. Refusé, donc — et **vérifié** : la résolution des alias fonctionne
# et la règle de cloisonnement se déclenche bien (P1-05).
allowBuilds:
  unrs-resolver: false

# --- Âge minimum des versions -----------------------------------------------
#
# pnpm 11 refuse par défaut les versions publiées depuis trop peu de temps : la
# plupart des compromissions de registre sont détectées et dépubliées en quelques
# jours. La protection est conservée **sans aucune exception** : quand une version
# est trop récente, on prend la précédente plutôt que d'inscrire une dérogation.
# C'est ce qui a été fait pour `typescript-eslint` (8.67.0 publiée la veille →
# 8.65.0 retenue, même domaine de compatibilité).
